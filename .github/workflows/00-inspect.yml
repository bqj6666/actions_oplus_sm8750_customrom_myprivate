name: 00 Inspect Source Tree

# 只做侦察：同步 manifest、核对目录布局、问 bazel 目标是否存在。
# 不编译、不产出、不改任何设备。

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/00-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Disk before
        run: df -h / && nproc && free -g

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Init manifest (shallow, partial clone)
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p src logs && cd src
          git config --global http.version HTTP/1.1
          git config --global user.name  "ci"
          git config --global user.email "ci@example.invalid"
          repo init -u https://github.com/OnePlusOSS/kernel_manifest \
                    -b oneplus/sm8750 -m oneplus_13_b.xml \
                    --depth=1 --partial-clone --clone-filter=blob:limit=1m
          repo manifest -o "$GITHUB_WORKSPACE/logs/manifest-raw.xml"
          echo "== manifest projects =="
          grep -oE 'name="[^"]+"' .repo/manifests/oneplus_13_b.xml | sort -u \
            | tee "$GITHUB_WORKSPACE/logs/manifest-projects.txt"

      - name: Sync
        working-directory: ${{ github.workspace }}/src
        run: |
          repo sync -n -c --no-tags -j4 --fail-fast 2>&1 \
            | tee "$GITHUB_WORKSPACE/logs/sync-1.log" | tail -40
          repo sync -l -j4 --fail-fast 2>&1 \
            | tee "$GITHUB_WORKSPACE/logs/sync-2.log" | tail -40
          repo manifest -r -o "$GITHUB_WORKSPACE/logs/manifest-locked.xml"
          df -h /

      - name: Dump layout
        working-directory: ${{ github.workspace }}/src
        run: |
          OUT="$GITHUB_WORKSPACE/logs/layout.txt"
          {
            echo "## top level"; ls -1
            echo; echo "## kernel_platform"; ls -1 kernel_platform 2>&1 | head -40
            echo; echo "## kernel_platform/tools"; ls -1 kernel_platform/tools 2>&1 | head -20
            echo; echo "## vendor present?"; ls -1 vendor 2>&1 | head -20
            echo; echo "## kernel_platform/vendor?"; ls -1 kernel_platform/vendor 2>&1 | head -20
            echo; echo "## wlan tree"; ls -1 vendor/qcom/opensource/wlan 2>&1 | head -20
            echo; echo "## qcacld bazel files"
            ls -1 vendor/qcom/opensource/wlan/qcacld-3.0/BUILD.bazel \
                  vendor/qcom/opensource/wlan/qcacld-3.0/*.bzl 2>&1
            echo; echo "## target variants (sun/peach)"
            grep -nE 'sun|peach' vendor/qcom/opensource/wlan/qcacld-3.0/target_variants.bzl 2>&1 | head -30
            echo; echo "## wonder dir"
            ls -1 vendor/oplus/kernel/wifi 2>&1 | head -20
          } | tee "$OUT"

      - name: bazel query targets
        working-directory: ${{ github.workspace }}/src
        run: |
          OUT="$GITHUB_WORKSPACE/logs/bazel-query.txt"
          {
            echo "## tools/bazel exists?"; ls -l kernel_platform/tools/bazel 2>&1
            echo; echo "## try query from kernel_platform"
            cd kernel_platform
            ./tools/bazel --output_user_root="$GITHUB_WORKSPACE/bazel-cache" \
              query 'kind(".*_dist", //vendor/qcom/opensource/wlan/qcacld-3.0:all)' 2>&1 | head -60
          } | tee "$OUT"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-logs
          path: logs/
          retention-days: 7
