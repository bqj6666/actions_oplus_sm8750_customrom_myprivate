name: 06 Build WLAN Wonder Set

# 目标：用「我们自己的 common（palazik 6.6.143）+ OnePlusOSS msm-kernel/vendor」
# 编出与运行内核 ABI 自洽的一整套 WLAN 模块，并套上 wonder 覆盖层与基础补丁。
# 产物：9 个 .ko + 所有 Module.symvers + 日志，挂 Release 供本机 CRC 闸门复核。
# 注意：这里编出来的 Image 只作为 kernel_build 的中间产物，不用于刷机。

on:
  workflow_dispatch:
    inputs:
      common_branch:
        description: 'common 分支（palazik fork）'
        default: '6.6.143_oneplus13_coloros16'
      overlay:
        description: '套用 wonder 覆盖层 + 补丁'
        type: boolean
        default: true
      jobs:
        description: 'bazel jobs'
        default: '2'
      skip_qca:
        description: '只编到平台栈为止（排错用）'
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/06-build-wlan-wonder.yml'

permissions:
  contents: write

env:
  COMMON_OWNER: palazik
  COMMON_REPO: android_kernel_common_oneplus_sm8750
  COMMON_BRANCH: ${{ inputs.common_branch || '6.6.143_oneplus13_coloros16' }}
  OVERLAY: ${{ github.event_name == 'workflow_dispatch' && inputs.overlay == false && 'false' || 'true' }}
  JOBS: ${{ inputs.jobs || '2' }}
  SKIP_QCA: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_qca == true && 'true' || 'false' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    steps:
      - name: 📂 Checkout（供 .github/ci 脚本使用）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 💾 Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/lib/jvm || true
          df -h /

      - name: 🧰 Deps + repo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends patch rsync zip unzip bc bison flex \
              libssl-dev libelf-dev libncurses-dev python3 python3-pip cpio
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git --version

      - name: 📥 上游覆盖层
        run: |
          git config --global http.version HTTP/1.1
          git clone --depth=1 https://github.com/Weverses/OPAirDrop "$GITHUB_WORKSPACE/opa"
          git -C "$GITHUB_WORKSPACE/opa" rev-parse HEAD | tee "$GITHUB_WORKSPACE/opa-head.txt"

      - name: 🔄 Sync（common 换成 palazik 分支）
        run: |
          mkdir -p src logs && cd src
          repo init -u https://github.com/OnePlusOSS/kernel_manifest -b oneplus/sm8750 \
                    -m oneplus_13_b.xml --depth=1 --partial-clone --clone-filter=blob:limit=1m
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/opa-common.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote fetch="https://github.com/${COMMON_OWNER}" name="palazik" />
            <remove-project name="${COMMON_REPO}" />
            <project remote="palazik" name="${COMMON_REPO}" path="kernel_platform/common"
                     revision="$COMMON_BRANCH" />
          </manifest>
          XML
          cat .repo/local_manifests/opa-common.xml | tee "$GITHUB_WORKSPACE/logs/local-manifest.xml"
          repo sync -n -c --no-tags -j4 --fail-fast 2>&1 | tail -5
          repo sync -l -j4 --fail-fast 2>&1 | tail -5
          cd kernel_platform/common && git log --oneline -1 | tee "$GITHUB_WORKSPACE/logs/common-head.txt"
          cd "$GITHUB_WORKSPACE/src"
          repo manifest -r -o "$GITHUB_WORKSPACE/logs/manifest-locked.xml"
          df -h /

      - name: 🔗 Bootstrap（上游 bazel 布局）
        run: |
          cd src/kernel_platform
          ln -sfn ../vendor vendor
          ln -sfn ../msm-kernel/msm_kernel_extensions.bzl build/msm_kernel_extensions.bzl
          [ -e build/abl_extensions.bzl ] || ln -sfn ../bootable/bootloader/edk2/abl_extensions.bzl build/abl_extensions.bzl 2>/dev/null || true

      - name: 🩹 补丁 + 覆盖层（先补丁，后覆盖层，覆盖层为准）
        if: env.OVERLAY == 'true'
        run: |
          cd "$GITHUB_WORKSPACE"
          cd src
          for p in "$GITHUB_WORKSPACE"/opa/kernel/patches/000[1-7]-*.patch; do
            case "$p" in *0007-session-dp-candidate.patch) echo "SKIP candidate $(basename "$p")" | tee -a "$GITHUB_WORKSPACE/logs/overlay.log"; continue;; esac
            if patch -p1 -l --batch --forward < "$p" >> "$GITHUB_WORKSPACE/logs/overlay.log" 2>&1; then
              echo "APPLIED $(basename "$p")" | tee -a "$GITHUB_WORKSPACE/logs/overlay.log"
            else
              echo "PATCH-HAD-FAILURES $(basename "$p")（以覆盖层为准）" | tee -a "$GITHUB_WORKSPACE/logs/overlay.log"
            fi
          done
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY' 2>&1 | tee -a logs/overlay.log
          import json, shutil, os
          opa = os.path.join(os.environ['GITHUB_WORKSPACE'], 'opa')
          root = os.path.join(os.environ['GITHUB_WORKSPACE'], 'src')
          m = json.load(open(os.path.join(opa, 'kernel/source-map.json')))
          missing = 0
          for src, meta in m.items():
              if 'kernel_path' not in meta:
                  print('SKIP meta', src)
                  continue
              dst = os.path.join(root, meta['kernel_path'])
              if not os.path.exists(dst):
                  missing += 1
                  print('MISS-DST', meta['kernel_path'])
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              shutil.copy2(os.path.join(opa, src), dst)
          print('copied', len(m), 'overlay files; missing targets:', missing)
          PY
          rm -rf src/vendor/oplus/kernel/wifi/wonder src/kernel_platform/opairshare-route-b-provider
          cp -a opa/kernel/wonder src/vendor/oplus/kernel/wifi/wonder
          cp -a opa/kernel/provider src/kernel_platform/opairshare-route-b-provider
          echo "== 校验 ==" | tee -a "$GITHUB_WORKSPACE/logs/overlay.log"
          grep -c wonder src/vendor/oplus/kernel/wifi/oplus_local_modules.bzl | tee -a "$GITHUB_WORKSPACE/logs/overlay.log"
          ls src/vendor/oplus/kernel/wifi/wonder | head -3 | tee -a "$GITHUB_WORKSPACE/logs/overlay.log"

      - name: 🧩 生成 qdf_wondertap.h（上游漏提交该头）
        if: env.OVERLAY == 'true'
        run: |
          python3 "$GITHUB_WORKSPACE/.github/ci/make_qdf_wondertap.py" "$GITHUB_WORKSPACE/src" \
            | tee "$GITHUB_WORKSPACE/logs/qdf-wondertap.log"

      - name: ⚙️ 打开 PASSTHRU / WONDER
        if: env.OVERLAY == 'true'
        run: |
          cd src
          CFG=vendor/qcom/opensource/wlan/qcacld-3.0/configs/sun_gki_peach-v2_defconfig
          cp "$CFG" "$GITHUB_WORKSPACE/logs/defconfig.orig" || true
          python3 - "$CFG" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          keep = [l for l in p.read_text().splitlines()
                  if 'CONFIG_DRIVER_PASSTHRU_MODE' not in l and 'CONFIG_WONDER_SUPPORT' not in l]
          keep += ['CONFIG_DRIVER_PASSTHRU_MODE=y', 'CONFIG_WONDER_SUPPORT=y']
          p.write_text('\n'.join(keep) + '\n')
          print('defconfig updated:', p)
          PY
          grep -nE "PASSTHRU|WONDER" "$CFG" | tee "$GITHUB_WORKSPACE/logs/defconfig.tail"
          # qcacld 的 Kbuild 用 ccflags-$(CONFIG_DRIVER_PASSTHRU_MODE) 控制 -DDRIVER_PASSTHRU_MODE，
          # Kleaf 走的是 msm-kernel 的 sun_perf.config，所以必须加在那里。
          KR=arch/arm64/configs/vendor/sun_perf.config
          for kv in CONFIG_DRIVER_PASSTHRU_MODE=y CONFIG_WONDER_SUPPORT=y CONFIG_WONDER_RX_FILTER_SUPPORT=y; do
            grep -q "^${kv%%=*}=" "$KR" 2>/dev/null && sed -i "s/^${kv%%=*}=.*/$kv/" "$KR" || echo "$kv" >> "$KR"
          done
          grep -nE "PASSTHRU|WONDER" "$KR" | tee -a "$GITHUB_WORKSPACE/logs/defconfig.tail"

      - name: 🩹 adios 改 builtin（只动 Kconfig 默认值，不动 defconfig）
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 - "$GITHUB_WORKSPACE" <<'PY' | tee "$GITHUB_WORKSPACE/logs/adios.log"
          import re, sys
          from pathlib import Path
          kc = Path(sys.argv[1]) / 'src/kernel_platform/common/block/Kconfig.iosched'
          s = kc.read_text()
          i = s.find('config MQ_IOSCHED_ADIOS')
          print('== 改前 ==')
          print(s[i:i + 200])
          j = s.find('\nconfig ', i + 1)
          block = s[i:j if j > 0 else len(s)]
          nb, n = re.subn(r'(\n[ \t]*default[ \t]+)m([ \t]*\n)', r'\1y\2', block)
          if n == 0 and 'default' not in block:
              nb = block.replace('config MQ_IOSCHED_ADIOS',
                                 'config MQ_IOSCHED_ADIOS\n\tdefault y', 1)
              n = 1
          kc.write_text(s[:i] + nb + s[j if j > 0 else len(s):])
          print('== 改后（替换 %d 处）==' % n)
          print(kc.read_text()[i:i + 200])
          PY
          grep -n 'MQ_IOSCHED_ADIOS' kernel_platform/common/arch/arm64/configs/gki_defconfig || echo "gki_defconfig 未提及 adios（正确）"

      - name: 🩹 msm-kernel 版本对齐 + tls 预登记
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY' | tee logs/msm-fix.log
          import re
          from pathlib import Path
          root = Path('src/kernel_platform')
          cm, mm = root / 'common/Makefile', root / 'msm-kernel/Makefile'
          want = {}
          ctext = cm.read_text()
          for k in ('VERSION', 'PATCHLEVEL', 'SUBLEVEL'):
              m = re.search(rf'^{k}\s*=\s*(\d+)\s*$', ctext, re.M)
              if m:
                  want[k] = m.group(1)
          text = mm.read_text()
          for k, v in want.items():
              text = re.sub(rf'^{k}\s*=\s*\d+\s*$', f'{k} = {v}', text, count=1, flags=re.M)
          mm.write_text(text)
          print('msm-kernel 版本对齐 ->', want)
          b = root / 'msm-kernel/sun.bzl'
          s = b.read_text()
          marker = '_sun_in_tree_modules = ['
          i = s.find(marker)
          if i >= 0 and '"net/tls/tls.ko"' not in s[i:i + 40000]:
              at = i + len(marker)
              s = s[:at] + '\n        "net/tls/tls.ko",' + s[at:]
              b.write_text(s)
              print('sun.bzl _sun_in_tree_modules += net/tls/tls.ko')
          else:
              print('tls 已在清单内或未找到标记')
          PY
          grep -nE '^(VERSION|PATCHLEVEL|SUBLEVEL) ' src/kernel_platform/msm-kernel/Makefile | head -3

      - name: 🏗️ provider（ddk 模块，最快）
        continue-on-error: true
        run: |
          cd src/kernel_platform
          B=./tools/bazel; O="--output_user_root=$GITHUB_WORKSPACE/bazel-cache"
          C="--jobs=$JOBS --make_jobs=$JOBS --local_ram_resources=6144 --//msm-kernel:skip_abi=true --//msm-kernel:skip_abl=true --config=stamp --user_kmi_symbol_lists=//msm-kernel:android/abi_gki_aarch64_qcom --incompatible_sandbox_hermetic_tmp=false --nozstd_dwarf_compression"
          for attempt in 1 2 3; do
            if $B $O build $C //opairshare-route-b-provider:opairshare_wonder_provider //opairshare-route-b-provider:opairshare_route_b_probe > "$GITHUB_WORKSPACE/logs/build-provider.log" 2>&1; then break; fi
            h1=$(python3 "$GITHUB_WORKSPACE/.github/ci/heal_msm.py" "$GITHUB_WORKSPACE/src" "$GITHUB_WORKSPACE/logs/build-provider.log")
            h2=$(python3 "$GITHUB_WORKSPACE/.github/ci/heal_module_outs.py" "$GITHUB_WORKSPACE/logs/build-provider.log" "$GITHUB_WORKSPACE/src/kernel_platform/common/BUILD.bazel")
            echo "heal attempt $attempt: $h1 | common-outs=$h2"
            case "$h1$h2" in *nothing-to-heal*|*added=0*|"") break;; esac
          done
          grep -q 'Build did NOT complete' "$GITHUB_WORKSPACE/logs/build-provider.log" && echo "PROVIDER_BUILD_FAILED"
          tail -40 "$GITHUB_WORKSPACE/logs/build-provider.log"

      - name: 🏗️ 平台栈（cfg80211 / mac80211 / cnss*）
        continue-on-error: true
        run: |
          cd src/kernel_platform
          B=./tools/bazel; O="--output_user_root=$GITHUB_WORKSPACE/bazel-cache"
          C="--jobs=$JOBS --make_jobs=$JOBS --local_ram_resources=6144 --//msm-kernel:skip_abi=true --//msm-kernel:skip_abl=true --config=stamp --user_kmi_symbol_lists=//msm-kernel:android/abi_gki_aarch64_qcom --incompatible_sandbox_hermetic_tmp=false --nozstd_dwarf_compression"
          {
            echo "## cnss 目标探测"
            $B $O query '//vendor/qcom/opensource/wlan/...' 2>/dev/null | grep -iE 'cnss[^/]*\.ko$' | head -20
          } | tee "$GITHUB_WORKSPACE/logs/cnss-targets.txt"
          TARGETS="//msm-kernel:sun_perf/cfg80211.ko //msm-kernel:sun_perf/mac80211.ko"
          for t in $(grep -oE '^//[^ ]*cnss[^ ]*\.ko' "$GITHUB_WORKSPACE/logs/cnss-targets.txt" | sort -u); do TARGETS="$TARGETS $t"; done
          echo "$TARGETS" | tee "$GITHUB_WORKSPACE/logs/picked-targets.txt"
          for attempt in 1 2 3; do
            if $B $O build $C $TARGETS > "$GITHUB_WORKSPACE/logs/build-stack.log" 2>&1; then break; fi
            h1=$(python3 "$GITHUB_WORKSPACE/.github/ci/heal_msm.py" "$GITHUB_WORKSPACE/src" "$GITHUB_WORKSPACE/logs/build-stack.log")
            h2=$(python3 "$GITHUB_WORKSPACE/.github/ci/heal_module_outs.py" "$GITHUB_WORKSPACE/logs/build-stack.log" "$GITHUB_WORKSPACE/src/kernel_platform/common/BUILD.bazel")
            echo "heal attempt $attempt: $h1 | common-outs=$h2"
            case "$h1$h2" in *nothing-to-heal*|*added=0*|"") break;; esac
          done
          grep -q 'Build did NOT complete' "$GITHUB_WORKSPACE/logs/build-stack.log" && echo "STACK_BUILD_FAILED"
          tail -60 "$GITHUB_WORKSPACE/logs/build-stack.log"

      - name: 🏗️ wonder（独立 ddk_module 包）
        if: env.OVERLAY == 'true'
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          D=src/kernel_platform/opairshare-wonder
          rm -rf "$D" && mkdir -p "$D"
          cp -a opa/kernel/wonder/. "$D"/
          rm -f "$D/Makefile" "$D/Kbuild" "$D/Makefile.include" "$D/Kconfig"
          cp .github/ci/wonder.BUILD.bazel "$D/BUILD.bazel"
          ls "$D" | head -20 | tee logs/wonder-src.txt
          cd src/kernel_platform
          B=./tools/bazel; O="--output_user_root=$GITHUB_WORKSPACE/bazel-cache"
          C="--jobs=$JOBS --make_jobs=$JOBS --local_ram_resources=6144 --//msm-kernel:skip_abi=true --//msm-kernel:skip_abl=true --config=stamp --user_kmi_symbol_lists=//msm-kernel:android/abi_gki_aarch64_qcom --incompatible_sandbox_hermetic_tmp=false --nozstd_dwarf_compression"
          $B $O build $C //opairshare-wonder:wonder > "$GITHUB_WORKSPACE/logs/build-wonder.log" 2>&1 || echo "WONDER_BUILD_FAILED"
          tail -40 "$GITHUB_WORKSPACE/logs/build-wonder.log"

      - name: 🏗️ qca_cld3（含 passthru 覆盖层）
        if: env.SKIP_QCA != 'true'
        continue-on-error: true
        run: |
          cd src/kernel_platform
          B=./tools/bazel; O="--output_user_root=$GITHUB_WORKSPACE/bazel-cache"
          C="--jobs=$JOBS --make_jobs=$JOBS --local_ram_resources=6144 --//msm-kernel:skip_abi=true --//msm-kernel:skip_abl=true --config=stamp --user_kmi_symbol_lists=//msm-kernel:android/abi_gki_aarch64_qcom --incompatible_sandbox_hermetic_tmp=false --nozstd_dwarf_compression"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          $B $O run $C //vendor/qcom/opensource/wlan/qcacld-3.0:sun_perf_peach-v2_modules_dist \
            -- --dist_dir="$GITHUB_WORKSPACE/dist" > "$GITHUB_WORKSPACE/logs/build-qca.log" 2>&1 || echo "QCA_BUILD_FAILED"
          tail -40 "$GITHUB_WORKSPACE/logs/build-qca.log"

      - name: 📦 收集（.ko + symvers）
        if: always()
        run: |
          set -x
          set +e
          D="$GITHUB_WORKSPACE/dist"; mkdir -p "$D" "$GITHUB_WORKSPACE/symvers"
          for n in cfg80211 mac80211 cnss2 cnss_plat_ipc_qmi_svc cnss_utils cnss_prealloc wlan_firmware_service \
                   qca_cld3_peach_v2 wonder opairshare_wonder_provider opairshare_route_b_probe; do
            f=$(find -L "$GITHUB_WORKSPACE/src" -name "$n.ko" -not -path '*/.repo/*' 2>/dev/null | head -1)
            if [ -n "$f" ]; then cp -v "$f" "$D/"; else echo "MISSING $n.ko"; fi
          done
          i=0
          find -L "$GITHUB_WORKSPACE/src" -name 'Module.symvers' -not -path '*/.repo/*' 2>/dev/null | while read -r f; do
            i=$((i+1)); cp "$f" "$GITHUB_WORKSPACE/symvers/symvers-$i-$(echo "$f" | md5sum | cut -c1-8)"; done
          STRIP=$(find "$GITHUB_WORKSPACE/src/kernel_platform/prebuilts" -path '*bin/llvm-strip' 2>/dev/null | head -1)
          echo "strip=$STRIP"
          for k in "$D"/*.ko; do
            [ -f "$k" ] || continue
            b=$(stat -c%s "$k"); [ -n "$STRIP" ] && "$STRIP" --strip-debug "$k" || true
            printf '%s %s -> %s\n' "$(basename "$k")" "$b" "$(stat -c%s "$k")"
            strings "$k" | grep -m1 '^vermagic=' | sed 's/^/    /'
          done | tee "$GITHUB_WORKSPACE/logs/dist.txt"
          ls -l "$D" | tee -a "$GITHUB_WORKSPACE/logs/dist.txt"
          ls -l "$GITHUB_WORKSPACE/symvers" | head -20 | tee -a "$GITHUB_WORKSPACE/logs/dist.txt"

      - name: ✅ 判定（缺件就把 run 标红）
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          miss=""
          for n in cfg80211 mac80211 cnss2 cnss_plat_ipc_qmi_svc qca_cld3_peach_v2 oneplus13_wonder_provider wonder; do
            if ls dist 2>/dev/null | grep -qx "$n.ko"; then echo "OK   $n.ko"; else echo "MISS $n.ko"; miss="$miss $n"; fi
          done
          for f in logs/build-stack.log logs/build-qca.log logs/build-provider.log logs/build-wonder.log; do
            grep -q 'Build did NOT complete' "$f" 2>/dev/null && echo "FAILED-BUILD $f"
          done
          [ -z "$miss" ] || { echo "缺少模块:$miss"; exit 1; }

      - name: 🚀 Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          zip -qr9 "wlan-wonder-${GITHUB_RUN_ID}.zip" dist symvers logs || true
          TAG="ci-wlan-wonder-${GITHUB_RUN_ID}"
          NOTES="$(head -80 logs/dist.txt 2>/dev/null)
          common=$COMMON_BRANCH
          overlay=$OVERLAY"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "WLAN wonder set ${GITHUB_RUN_ID}" --notes "$NOTES" \
            "wlan-wonder-${GITHUB_RUN_ID}.zip" || true
