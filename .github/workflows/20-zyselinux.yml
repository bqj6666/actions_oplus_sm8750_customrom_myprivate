name: 20 Zygisk selinux adbroot filter

# 构建 Zygisk 用户态模块（不碰内核/boot），产物挂 Release。

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/20-zyselinux.yml'
      - 'zyselinux/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Locate NDK
        run: |
          set -e
          NDK=""
          for d in "$ANDROID_NDK_LATEST_HOME" /usr/local/lib/android/sdk/ndk/*; do
            [ -d "$d" ] && NDK="$d" && break
          done
          [ -n "$NDK" ] || { echo "no NDK found"; ls /usr/local/lib/android/sdk || true; exit 1; }
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          ls "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" | grep -m3 clang++

      - name: Build arm64-v8a.so
        run: |
          set -e
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          mkdir -p out/zygisk
          "$CXX" -shared -fPIC -O2 -fvisibility=hidden -fno-exceptions -fno-rtti \
                 -static-libstdc++ -o out/zygisk/arm64-v8a.so zyselinux/native/selinux_hide.cpp -llog
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" -W --dyn-syms out/zygisk/arm64-v8a.so | grep -E 'zygisk_module_entry|zygisk_module_exit'
          ls -lh out/zygisk/arm64-v8a.so

      - name: Package module zip
        run: |
          set -e
          cp zyselinux/module.prop out/
          cp zyselinux/customize.sh out/
          chmod 755 out/customize.sh
          cd out
          zip -qr9 "../zy_selinux_adbroot-${GITHUB_RUN_ID}.zip" .
          cd ..
          ls -lh zy_selinux_adbroot-*.zip
          sha256sum zy_selinux_adbroot-*.zip | tee sha256.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ci-zyselinux-${GITHUB_RUN_ID}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Zygisk selinux adbroot filter ${GITHUB_RUN_ID}" \
            --notes "userspace filter: hides ODM adbroot domain from app UIDs" \
            "zy_selinux_adbroot-${GITHUB_RUN_ID}.zip" || true
