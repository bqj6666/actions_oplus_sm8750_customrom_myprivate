name: 05 Build WLAN Stack v2

# 修正版：qca + cfg80211 + mac80211 + cnss*，产物统一 strip 后挂 Release。

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/05-build-stack-v2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/lib/jvm || true
          df -h /

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p src logs && cd src
          git config --global http.version HTTP/1.1
          repo init -u https://github.com/OnePlusOSS/kernel_manifest -b oneplus/sm8750 \
                    -m oneplus_13_b.xml --depth=1 --partial-clone --clone-filter=blob:limit=1m
          repo sync -n -c --no-tags -j4 --fail-fast 2>&1 | tail -3
          repo sync -l -j4 --fail-fast 2>&1 | tail -3
          repo manifest -r -o "$GITHUB_WORKSPACE/logs/manifest-locked.xml"

      - name: Bootstrap
        working-directory: ${{ github.workspace }}/src/kernel_platform
        run: |
          ln -sfn ../vendor vendor
          ln -sfn ../msm-kernel/msm_kernel_extensions.bzl build/msm_kernel_extensions.bzl
          [ -e build/abl_extensions.bzl ] || ln -sfn ../bootable/bootloader/edk2/abl_extensions.bzl build/abl_extensions.bzl 2>/dev/null || true

      - name: Probe cnss labels
        working-directory: ${{ github.workspace }}/src/kernel_platform
        run: |
          B=./tools/bazel
          O="--output_user_root=$GITHUB_WORKSPACE/bazel-cache"
          {
            echo "## msm-kernel cnss"
            $B $O query '//msm-kernel:*' 2>/dev/null | grep -i cnss | head -20
            echo; echo "## wlan dir cnss"
            $B $O query '//vendor/qcom/opensource/wlan/...' 2>/dev/null | grep -iE 'cnss|platform:' | head -30
          } | tee "$GITHUB_WORKSPACE/logs/cnss-labels.txt"

      - name: Build stack
        working-directory: ${{ github.workspace }}/src/kernel_platform
        run: |
          B=./tools/bazel
          O="--output_user_root=$GITHUB_WORKSPACE/bazel-cache"
          COMMON="--jobs=2 --make_jobs=2 --local_ram_resources=6144 --//msm-kernel:skip_abi=true --//msm-kernel:skip_abl=true --config=stamp --user_kmi_symbol_lists=//msm-kernel:android/abi_gki_aarch64_qcom --incompatible_sandbox_hermetic_tmp=false --nozstd_dwarf_compression"
          TARGETS="//msm-kernel:sun_perf/cfg80211.ko //msm-kernel:sun_perf/mac80211.ko"
          # cnss 目标按探测结果动态追加
          for t in $(grep -oE '^//[^ ]*cnss[^ ]*\.ko' "$GITHUB_WORKSPACE/logs/cnss-labels.txt" | sort -u); do
            TARGETS="$TARGETS $t"
          done
          echo "$TARGETS" | tee "$GITHUB_WORKSPACE/logs/picked-targets.txt"
          $B $O build $COMMON $TARGETS 2>&1 | tail -30 | tee "$GITHUB_WORKSPACE/logs/build-stack.log"

      - name: Build qca dist
        working-directory: ${{ github.workspace }}/src/kernel_platform
        run: |
          B=./tools/bazel
          O="--output_user_root=$GITHUB_WORKSPACE/bazel-cache"
          COMMON="--jobs=2 --make_jobs=2 --local_ram_resources=6144 --//msm-kernel:skip_abi=true --//msm-kernel:skip_abl=true --config=stamp --user_kmi_symbol_lists=//msm-kernel:android/abi_gki_aarch64_qcom --incompatible_sandbox_hermetic_tmp=false --nozstd_dwarf_compression"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          $B $O run $COMMON \
            //vendor/qcom/opensource/wlan/qcacld-3.0:sun_perf_peach-v2_modules_dist \
            -- --dist_dir="$GITHUB_WORKSPACE/dist" 2>&1 | tail -20 | tee "$GITHUB_WORKSPACE/logs/build-qca.log"

      - name: Collect and strip
        run: |
          set -x
          for n in cfg80211 mac80211 cnss2 cnss_utils cnss_prealloc wlan_firmware_service; do
            f=$(find -L "$GITHUB_WORKSPACE/src/kernel_platform/bazel-bin" -name "$n.ko" 2>/dev/null | head -1)
            [ -n "$f" ] && cp -v "$f" "$GITHUB_WORKSPACE/dist/"
          done
          STRIP=$(find "$GITHUB_WORKSPACE/src/kernel_platform/prebuilts" -path '*bin/llvm-strip' 2>/dev/null | head -1)
          echo "strip=$STRIP"
          for k in "$GITHUB_WORKSPACE"/dist/*.ko; do
            [ -f "$k" ] || continue
            b=$(stat -c%s "$k"); [ -n "$STRIP" ] && "$STRIP" --strip-debug "$k" || true
            printf '%s %s -> %s\n' "$(basename "$k")" "$b" "$(stat -c%s "$k")"
          done | tee "$GITHUB_WORKSPACE/logs/strip.txt"
          {
            echo "## dist"; ls -l "$GITHUB_WORKSPACE/dist"
            echo; echo "## vermagic + sha256"
            for k in "$GITHUB_WORKSPACE"/dist/*.ko; do
              [ -f "$k" ] || continue
              printf '%s\n  ' "$(basename "$k")"; strings "$k" | grep -m1 vermagic; sha256sum "$k"
            done
          } | tee "$GITHUB_WORKSPACE/logs/dist.txt"

      - name: Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/dist" && zip -qr9 "$GITHUB_WORKSPACE/wlan-stack-${GITHUB_RUN_ID}.zip" . || true
          TAG="ci-wlan-stack2-${GITHUB_RUN_ID}"
          NOTES="$(head -60 "$GITHUB_WORKSPACE/logs/dist.txt" 2>/dev/null)"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "WLAN stack v2 ${GITHUB_RUN_ID}" --notes "$NOTES" \
            "$GITHUB_WORKSPACE/wlan-stack-${GITHUB_RUN_ID}.zip" || true

      - name: Publish logs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RURL="https://github.com/${GITHUB_REPOSITORY}.git"
          CH='!gh auth git-credential'
          rm -rf /tmp/logrepo
          if ! git -c credential.helper="$CH" clone -q --depth=1 --branch ci/logs "$RURL" /tmp/logrepo 2>/dev/null; then
            mkdir -p /tmp/logrepo && cd /tmp/logrepo && git init -q && git checkout -q -b ci/logs
            git remote add origin "$RURL"
          fi
          cd /tmp/logrepo
          mkdir -p "runs/${{ github.run_id }}"
          cp -r "$GITHUB_WORKSPACE/logs/." "runs/${{ github.run_id }}/"
          git add -A
          git -c user.name=bqj6666 -c user.email=bqj6666@users.noreply.github.com \
              commit -q -m "ci: stack v2 logs for run ${{ github.run_id }}" || true
          git -c credential.helper="$CH" push -q origin ci/logs
