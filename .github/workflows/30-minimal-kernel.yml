name: 30 Minimal Kernel Build

# 完全自控的最小构建：只为「参考包 + 我们的补丁」。
# - 源码：palazik 6.6.143 分支，钉到参考包构建日的提交 2a8b8b88
# - KSU：BakaSU 9dbce02（与参考包 KSUVER 35205 对应）
# - SUSFS：a0f9c59e
# - 配置：直接使用参考包 Image 里内嵌的 .config（保证与参考包逐字节一致）
# - 产物：把新 Image 塞回参考包的 AK3 结构里
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/30-minimal-kernel.yml'
      - 'patches/0001-selinux-hide-adbroot.patch'

permissions:
  contents: write

env:
  KSRC_COMMIT: 2a8b8b889b839616bbeddbdd457b9c2d7e74cb00
  KSU_COMMIT: 9dbce02e511ea6b6305a238b84e456f6a92e1d0b
  SUSFS_COMMIT: a0f9c59e2243f8a5db955f4ad1686d5e0ad26e1a
  REF_AK3: https://github.com/bluerabbitsu33/actions_oplus_sm8750_customrom/releases/download/OPPO-OPlus-Realme-build-261005141717/AnyKernel3_BakaSU_35205_6.6.143_palaziks_AOSP-ShiftPorts.zip

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk + deps
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/lib/jvm /usr/share/swift /opt/az /usr/local/.ghcup || true
          echo "== disk after cleanup"; df -h /
          sudo apt-get update -qq
          sudo apt-get install -y -qq libelf-dev bc bison flex libssl-dev python3 python-is-python3 zip unzip aria2
          df -h /

      - name: Restore clang (shared cache from the 10-workflow)
        uses: actions/cache/restore@v4
        with:
          path: kernel_workspace/clang-r563880c
          key: Linux-aosp-clang-clang-r563880c

      - name: Restore build-tools (shared cache)
        uses: actions/cache/restore@v4
        with:
          path: kernel_workspace/build-tools
          key: codelinaro-build-tools-ks-kernel-lnx-4.0

      - name: Ensure toolchain present
        run: |
          set -e
          CL=kernel_workspace/clang-r563880c
          BT=kernel_workspace/build-tools
          if [ ! -x "$CL/bin/clang" ]; then
            echo "cache miss, downloading clang"
            mkdir -p "$CL" && cd "$CL"
            for try in 1 2 3 4 5; do
              curl -fL -C - --retry 3 --retry-all-errors -o c.tar.gz \
                "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-qpr2-release/clang-r563880c.tar.gz" && break
              echo "retry $try"; sleep 5
            done
            tar -zxf c.tar.gz && rm -f c.tar.gz && cd -
          fi
          if [ -z "$(ls -A "$BT" 2>/dev/null)" ]; then
            rm -rf "$BT"
            git clone -q --depth=1 -b ks-kernel.lnx.4.0.r1-rel https://git.codelinaro.org/clo/la/kernel/prebuilts/build-tools.git "$BT"
          fi
          ls -d "$BT"/linux-x86/bin 2>/dev/null || ls -A "$BT" | head
          "$CL/bin/clang" --version | head -1
          df -h /

      - name: Kernel source (pinned commit)
        run: |
          mkdir -p kernel_workspace && cd kernel_workspace
          curl -L --retry 3 -o src.zip "https://github.com/palazik/android_kernel_common_oneplus_sm8750/archive/$KSRC_COMMIT.zip"
          unzip -q src.zip
          mv android_kernel_common_oneplus_sm8750-* common
          rm -f src.zip
          rm -f common/android/abi_gki_protected_exports_* || true
          sed -i 's/ -dirty//g' common/scripts/setlocalversion

      - name: KSU setup + pin
        working-directory: kernel_workspace/common
        run: |
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/$KSU_COMMIT/kernel/setup.sh" | bash -s main
          ls -l drivers/kernelsu
          cd KernelSU
          git fetch -q --depth=1 origin $KSU_COMMIT
          git checkout -q FETCH_HEAD
          echo "KSU at $(git rev-parse --short HEAD)"
          ls -l kernel/feature/selinux_hide.c

      - name: SUSFS (pinned)
        working-directory: kernel_workspace
        run: |
          git clone -q --depth=1 -b gki-android15-6.6 https://gitlab.com/simonpunk/susfs4ksu.git
          cd susfs4ksu && git fetch -q --depth=1 origin $SUSFS_COMMIT && git checkout -q FETCH_HEAD && cd ..
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch ./common/
          cp susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
          cd common && patch -p1 --forward < 50_add_susfs_in_gki-android15-6.6.patch

      - name: Apply our patch (real path, not symlink games)
        working-directory: kernel_workspace/common
        run: |
          REAL=$(readlink -f drivers/kernelsu)/feature/selinux_hide.c
          echo "real file: $REAL"
          patch -p1 --forward -d "$(dirname "$REAL")/../.." < "$GITHUB_WORKSPACE/patches/0001-selinux-hide-adbroot.patch" || {
            echo "direct patch failed, trying path rewrite"; exit 1; }
          grep -c 'zy_sel:' "$REAL"
          ls -l "$REAL"

      - name: Reference config
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -L --retry 3 -o ref.zip "$REF_AK3"
          unzip -o -q ref.zip Image -d ref
          python3 - <<'PY'
          import gzip, pathlib
          d = pathlib.Path('ref/Image').read_bytes()
          i, j = d.find(b'IKCFG_ST'), d.find(b'IKCFG_ED')
          assert i > 0 and j > i, 'no ikconfig in reference Image'
          pathlib.Path('kernel_workspace/kout').mkdir(parents=True, exist_ok=True)
          pathlib.Path('kernel_workspace/kout/.config').write_bytes(gzip.decompress(d[i+8:j]))
          print('reference .config lines:', gzip.decompress(d[i+8:j]).count(b'\n'))
          PY
          tail -3 kernel_workspace/kout/.config

      - name: Build
        working-directory: kernel_workspace/common
        run: |
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang-r563880c/bin:$GITHUB_WORKSPACE/kernel_workspace/build-tools/linux-x86/bin:$PATH"
          export O="$GITHUB_WORKSPACE/kernel_workspace/kout"
          REAL=$(readlink -f drivers/kernelsu)/feature/selinux_hide.c
          md5sum "$REAL" > /tmp/src_before.md5
          # control probe in a core file: if this string is missing from the Image too,
          # the build is not compiling this source tree at all
          # control probe: a kept global with a unique string, appended to a core file
          if ! grep -q ZZPROBE765 init/main.c; then
            printf '\nconst char zzprobe765[] __attribute__((used)) = "ZZPROBE765";\n' >> init/main.c
          fi
          echo "probe lines in init/main.c: $(grep -c ZZPROBE765 init/main.c || true)"
          grep -n 'ZZPROBE765' init/main.c | head -2
          make -j$(nproc) LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=$O olddefconfig
          make -j$(nproc) LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=$O Image 2>&1 | tee /tmp/minbuild.log | tail -40

      - name: Build log diagnostics
        if: always()
        run: |
          REAL=$(readlink -f kernel_workspace/common/drivers/kernelsu)/feature/selinux_hide.c
          md5sum "$REAL"
          cat /tmp/src_before.md5 2>/dev/null || true
          echo "== CC lines for selinux_hide"; grep -n 'selinux_hide' /tmp/minbuild.log | head -5 || true
          echo "== object present?"; find kernel_workspace/kout -name 'selinux_hide*.o' -exec ls -l {} \; 2>/dev/null | head -3
          echo "== strings in object:"; find kernel_workspace/kout -name 'selinux_hide*.o' -exec sh -c 'strings "$1" | grep -c zy_sel' _ {} \; 2>/dev/null | head -3

      - name: Verify Image
        run: |
          IMG=kernel_workspace/kout/arch/arm64/boot/Image
          ls -l "$IMG"
          echo "== diagnostics =="
          grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS)=' kernel_workspace/kout/.config || echo "CONFIG_KSU missing from .config"
          ls -l kernel_workspace/common/drivers/kernelsu || true
          REAL=$(readlink -f kernel_workspace/common/drivers/kernelsu)/feature/selinux_hide.c
          echo "real file: $REAL"
          grep -c 'zy_sel:' "$REAL" || true
          echo "KernelSU strings in Image: $(strings "$IMG" | grep -c 'KernelSU' || true)"
          echo "core probe (ZZPROBE765) in Image: $(strings "$IMG" | grep -c 'ZZPROBE765' || true)"
          H=$(strings "$IMG" | grep -c 'zy_sel' || true)
          P=$(strings "$IMG" | grep -c 'KSU_PROBE_MARKER_V1' || true)
          echo "zy_sel hits: $H ; probe hits: $P"
          [ "$H" -gt 0 ] || { echo "ERROR: patched code missing from Image"; exit 1; }
          echo "OK"

      - name: Repack AK3 with new Image
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf pkg && mkdir pkg && unzip -q ref.zip -d pkg
          cp kernel_workspace/kout/arch/arm64/boot/Image pkg/Image
          ( cd pkg && zip -qr9 "$GITHUB_WORKSPACE/AnyKernel3_BakaSU_35205_6.6.143_adbroot.zip" . )
          ls -lh AnyKernel3_*.zip
          sha256sum AnyKernel3_*.zip | tee sha256.txt

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "ci-min-${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" \
            --title "minimal kernel ${{ github.run_id }}" \
            --notes "$(cat sha256.txt)" "AnyKernel3_BakaSU_35205_6.6.143_adbroot.zip"
