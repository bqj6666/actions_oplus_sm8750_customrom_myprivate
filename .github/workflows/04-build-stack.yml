name: 04 Build WLAN Stack

# 编一整套互相匹配的 WLAN 驱动：qca + cfg80211 + mac80211 + cnss*。
# 原因：基线 qca 与机器上 stock cfg80211/cnss2 的 CRC 不一致（44 个符号），必须整套替换。
# 仍然不碰手机。

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/04-build-stack.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/lib/jvm || true
          df -h /

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p src logs && cd src
          git config --global http.version HTTP/1.1
          repo init -u https://github.com/OnePlusOSS/kernel_manifest -b oneplus/sm8750 \
                    -m oneplus_13_b.xml --depth=1 --partial-clone --clone-filter=blob:limit=1m
          repo sync -n -c --no-tags -j4 --fail-fast 2>&1 | tail -3
          repo sync -l -j4 --fail-fast 2>&1 | tail -3
          repo manifest -r -o "$GITHUB_WORKSPACE/logs/manifest-locked.xml"

      - name: Bootstrap
        working-directory: ${{ github.workspace }}/src/kernel_platform
        run: |
          ln -sfn ../vendor vendor
          ln -sfn ../msm-kernel/msm_kernel_extensions.bzl build/msm_kernel_extensions.bzl
          [ -e build/abl_extensions.bzl ] || ln -sfn ../bootable/bootloader/edk2/abl_extensions.bzl build/abl_extensions.bzl 2>/dev/null || true

      - name: Build matched WLAN stack
        working-directory: ${{ github.workspace }}/src/kernel_platform
        run: |
          B=./tools/bazel
          O="--output_user_root=$GITHUB_WORKSPACE/bazel-cache"
          COMMON="--jobs=2 --make_jobs=2 --local_ram_resources=6144 --//msm-kernel:skip_abi=true --//msm-kernel:skip_abl=true --config=stamp --user_kmi_symbol_lists=//msm-kernel:android/abi_gki_aarch64_qcom --incompatible_sandbox_hermetic_tmp=false --nozstd_dwarf_compression"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          : > "$GITHUB_WORKSPACE/logs/picked-targets.txt"
          for m in cfg80211 mac80211 cnss2 cnss_utils cnss_prealloc wlan_firmware_service; do
            t="//msm-kernel:sun_perf/$m.ko"
            if $B $O query "$t" >/dev/null 2>&1; then
              echo "$t" >> "$GITHUB_WORKSPACE/logs/picked-targets.txt"
            fi
          done
          echo "//vendor/qcom/opensource/wlan/qcacld-3.0:sun_perf_peach-v2_modules_dist" >> "$GITHUB_WORKSPACE/logs/picked-targets.txt"
          cat "$GITHUB_WORKSPACE/logs/picked-targets.txt"
          $B $O build $COMMON $(cat "$GITHUB_WORKSPACE/logs/picked-targets.txt") 2>&1 | tail -40 \
            | tee "$GITHUB_WORKSPACE/logs/build-stack.log"
          # 收集产物
          for ko in $(find -L bazel-bin/msm-kernel/sun_perf -maxdepth 1 -name '*.ko' 2>/dev/null); do
            b=$(basename "$ko"); case "$b" in cfg80211.ko|mac80211.ko|cnss2.ko|cnss_utils.ko|cnss_prealloc.ko|wlan_firmware_service.ko) cp -v "$ko" "$GITHUB_WORKSPACE/dist/";; esac
          done

      - name: Build qca modules dist
        working-directory: ${{ github.workspace }}/src/kernel_platform
        run: |
          B=./tools/bazel
          O="--output_user_root=$GITHUB_WORKSPACE/bazel-cache"
          COMMON="--jobs=2 --make_jobs=2 --local_ram_resources=6144 --//msm-kernel:skip_abi=true --//msm-kernel:skip_abl=true --config=stamp --user_kmi_symbol_lists=//msm-kernel:android/abi_gki_aarch64_qcom --incompatible_sandbox_hermetic_tmp=false --nozstd_dwarf_compression"
          $B $O run $COMMON \
            //vendor/qcom/opensource/wlan/qcacld-3.0:sun_perf_peach-v2_modules_dist \
            -- --dist_dir="$GITHUB_WORKSPACE/dist" 2>&1 | tail -30 \
            | tee "$GITHUB_WORKSPACE/logs/build-qca.log"

      - name: Inspect + strip
        run: |
          STRIP=$(find "$GITHUB_WORKSPACE/src/kernel_platform/prebuilts" -path '*bin/llvm-strip' 2>/dev/null | head -1)
          echo "strip=$STRIP"
          for k in "$GITHUB_WORKSPACE"/dist/*.ko; do
            [ -f "$k" ] || continue
            before=$(stat -c%s "$k")
            if [ -n "$STRIP" ]; then "$STRIP" --strip-debug "$k" || true; fi
            after=$(stat -c%s "$k")
            printf '%s before=%s after=%s\n' "$(basename "$k")" "$before" "$after"
          done | tee "$GITHUB_WORKSPACE/logs/strip.txt"
          {
            echo "## dist"
            ls -l "$GITHUB_WORKSPACE/dist"
            echo; echo "## vermagic + sha256"
            for k in "$GITHUB_WORKSPACE"/dist/*.ko; do
              [ -f "$k" ] || continue
              printf '%s\n  ' "$(basename "$k")"; strings "$k" | grep -m1 vermagic; sha256sum "$k"
            done
          } | tee "$GITHUB_WORKSPACE/logs/dist.txt"

      - name: Create GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/dist" && zip -qr9 "$GITHUB_WORKSPACE/wlan-stack-${GITHUB_RUN_ID}.zip" . || true
          TAG="ci-wlan-stack-${GITHUB_RUN_ID}"
          NOTES="$(head -60 "$GITHUB_WORKSPACE/logs/dist.txt" 2>/dev/null)"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "WLAN stack ${GITHUB_RUN_ID}" --notes "$NOTES" \
            "$GITHUB_WORKSPACE/wlan-stack-${GITHUB_RUN_ID}.zip" || true

      - name: Publish logs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RURL="https://github.com/${GITHUB_REPOSITORY}.git"
          CH='!gh auth git-credential'
          rm -rf /tmp/logrepo
          if ! git -c credential.helper="$CH" clone -q --depth=1 --branch ci/logs "$RURL" /tmp/logrepo 2>/dev/null; then
            mkdir -p /tmp/logrepo && cd /tmp/logrepo && git init -q && git checkout -q -b ci/logs
            git remote add origin "$RURL"
          fi
          cd /tmp/logrepo
          mkdir -p "runs/${{ github.run_id }}"
          cp -r "$GITHUB_WORKSPACE/logs/." "runs/${{ github.run_id }}/"
          git add -A
          git -c user.name=bqj6666 -c user.email=bqj6666@users.noreply.github.com \
              commit -q -m "ci: wlan stack logs for run ${{ github.run_id }}" || true
          git -c credential.helper="$CH" push -q origin ci/logs
