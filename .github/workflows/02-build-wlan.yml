name: 02 Build WLAN Baseline

# P0b：不加任何补丁，编出本平台原厂基线 WLAN 模块，产物挂 Release（公开仓库可匿名下载）。
# 不碰手机、不刷机。

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/02-build-wlan.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/lib/jvm || true
          df -h /

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync manifest
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p src logs && cd src
          git config --global http.version HTTP/1.1
          repo init -u https://github.com/OnePlusOSS/kernel_manifest \
                    -b oneplus/sm8750 -m oneplus_13_b.xml \
                    --depth=1 --partial-clone --clone-filter=blob:limit=1m
          repo sync -n -c --no-tags -j4 --fail-fast 2>&1 | tail -5
          repo sync -l -j4 --fail-fast 2>&1 | tail -5
          repo manifest -r -o "$GITHUB_WORKSPACE/logs/manifest-locked.xml"
          df -h / | tee "$GITHUB_WORKSPACE/logs/disk.txt"

      - name: Bootstrap layout
        working-directory: ${{ github.workspace }}/src/kernel_platform
        run: |
          ln -sfn ../vendor vendor
          ln -sfn ../msm-kernel/msm_kernel_extensions.bzl build/msm_kernel_extensions.bzl
          [ -e build/abl_extensions.bzl ] || \
            ln -sfn ../bootable/bootloader/edk2/abl_extensions.bzl build/abl_extensions.bzl 2>/dev/null || true
          ls -l vendor build/msm_kernel_extensions.bzl

      - name: Build sun_perf_peach-v2 modules
        working-directory: ${{ github.workspace }}/src/kernel_platform
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ./tools/bazel --output_user_root="$GITHUB_WORKSPACE/bazel-cache" run \
            --jobs=2 --make_jobs=2 --local_ram_resources=6144 \
            --//msm-kernel:skip_abi=true --//msm-kernel:skip_abl=true \
            --config=stamp \
            --user_kmi_symbol_lists=//msm-kernel:android/abi_gki_aarch64_qcom \
            --incompatible_sandbox_hermetic_tmp=false --nozstd_dwarf_compression \
            //vendor/qcom/opensource/wlan/qcacld-3.0:sun_perf_peach-v2_modules_dist \
            -- --dist_dir="$GITHUB_WORKSPACE/dist" 2>&1 | tail -60 \
            | tee "$GITHUB_WORKSPACE/logs/build.log"

      - name: Inspect outputs
        run: |
          {
            echo "## dist listing"
            ls -lR "$GITHUB_WORKSPACE/dist" | head -80
            echo; echo "## vermagic + sha256"
            find "$GITHUB_WORKSPACE/dist" -name '*.ko' | while read -r k; do
              printf '%s\n  ' "$(basename "$k")"
              strings "$k" | grep -m1 vermagic
              sha256sum "$k"
            done
          } | tee "$GITHUB_WORKSPACE/logs/dist.txt"

      - name: Pack release assets
        run: |
          cd "$GITHUB_WORKSPACE/dist"
          zip -qr9 "$GITHUB_WORKSPACE/wlan-baseline-${{ github.run_id }}.zip" . || true
          ls -lh "$GITHUB_WORKSPACE"/*.zip

      - name: Create GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ci-wlan-baseline-${GITHUB_RUN_ID}"
          NOTES="$(cat "$GITHUB_WORKSPACE/logs/dist.txt" 2>/dev/null | head -60)"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "WLAN baseline ${GITHUB_RUN_ID}" \
            --notes "$NOTES" \
            "$GITHUB_WORKSPACE/wlan-baseline-${GITHUB_RUN_ID}.zip" || true

      - name: Publish logs to ci/logs branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RURL="https://github.com/${GITHUB_REPOSITORY}.git"
          CH='!gh auth git-credential'
          rm -rf /tmp/logrepo
          if ! git -c credential.helper="$CH" clone -q --depth=1 --branch ci/logs "$RURL" /tmp/logrepo 2>/dev/null; then
            mkdir -p /tmp/logrepo && cd /tmp/logrepo && git init -q && git checkout -q -b ci/logs
            git remote add origin "$RURL"
          fi
          cd /tmp/logrepo
          mkdir -p "runs/${{ github.run_id }}"
          cp -r "$GITHUB_WORKSPACE/logs/." "runs/${{ github.run_id }}/"
          git add -A
          git -c user.name=bqj6666 -c user.email=bqj6666@users.noreply.github.com \
              commit -q -m "ci: wlan baseline logs for run ${{ github.run_id }}" || true
          git -c credential.helper="$CH" push -q origin ci/logs
