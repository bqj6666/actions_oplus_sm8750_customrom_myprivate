name: OPAirDrop WLAN modules (sun perf peach-v2)

# 目标：用 OnePlusOSS oneplus_13_b.xml 基线树 + OPAirDrop 的 wonder 覆盖层/补丁，
# 编出「自洽的一套」WLAN 模块（cfg80211 / mac80211 / cnss2 / qca_cld3 / wonder / provider），
# 产物与日志一律上传，供本机做 CRC 复核（不通过不上机）。
on:
  workflow_dispatch:
    inputs:
      tree_ref:
        description: 'OnePlusOSS 清单分支'
        default: 'oneplus/sm8750'
      build_wlan:
        description: '是否编 qca_cld3（耗时最长）'
        type: boolean
        default: true
      jobs:
        description: 'bazel/make 并行数'
        default: '4'

env:
  ROOT: /home/runner/opa-build
  OPA_REF: main

jobs:
  wlan:
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    steps:
      - name: 💾 释放磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/lib/node_modules 2>/dev/null || true
          df -h /

      - name: 🧰 依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl python3 python3-pip rsync zip unzip bzip2 cpio \
            build-essential bc bison flex libssl-dev libelf-dev libncurses5 gettext-base
          git config --global user.name "opa-ci"
          git config --global user.email "opa-ci@users.noreply.github.com"
          git config --global http.version HTTP/1.1
          git --version && python3 --version

      - name: 📥 取上游 OPAirDrop（覆盖层与补丁）
        run: |
          mkdir -p "$ROOT/logs"
          git clone --depth=1 --branch "$OPA_REF" https://github.com/Weverses/OPAirDrop "$ROOT/opa"
          git -C "$ROOT/opa" rev-parse HEAD | tee "$ROOT/logs/opa-head.txt"
          ls "$ROOT/opa/kernel"

      - name: 🔧 repo 工具
        run: |
          curl --fail -L --retry 3 https://storage.googleapis.com/git-repo-downloads/repo -o "$ROOT/repo"
          chmod +x "$ROOT/repo"

      - name: 🔄 同步 OnePlusOSS 基线树
        run: |
          mkdir -p "$ROOT/tree"
          cd "$ROOT/tree"
          "$ROOT/repo" init -u https://github.com/OnePlusOSS/kernel_manifest \
            -b "${{ inputs.tree_ref }}" -m oneplus_13_b.xml --depth=1 \
            --partial-clone --clone-filter=blob:limit=1m 2>&1 | tee "$ROOT/logs/sync.log"
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/opairshare-baseline.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <extend-project name="android_kernel_common_oneplus_sm8750" revision="e1b346b6b4f4096eb342ae3684838a942fd6f6c4" upstream="refs/heads/oneplus/sm8750_b_16.0.0_oneplus_13" />
            <extend-project name="android_kernel_oneplus_sm8750" revision="6028f47faddaa27700f8dd3a1d83906ea8f27170" upstream="refs/heads/oneplus/sm8750_b_16.0.0_oneplus_13" />
            <extend-project name="android_kernel_modules_and_devicetree_oneplus_sm8750" revision="d50b305f7da9e14715a25120a4ac7b1a4b8b97c3" upstream="refs/heads/oneplus/sm8750_b_16.0.0_oneplus_13" />
          </manifest>
          XML
          "$ROOT/repo" sync -c --no-tags -j4 --fail-fast 2>&1 | tee -a "$ROOT/logs/sync.log"
          "$ROOT/repo" manifest -r -o "$ROOT/logs/source-lock.xml"
          df -h /
          echo "SYNC_DONE"

      - name: 🔍 探测树结构（关键目录 + 目标名）
        run: |
          cd "$ROOT/tree"
          { echo "== 根目录 =="; ls
            echo "== kernel_platform =="; ls kernel_platform | head -40
            echo "== vendor/oplus/kernel/wifi =="; ls vendor/oplus/kernel/wifi 2>/dev/null
            echo "== qcacld-3.0 配置 =="; ls vendor/qcom/opensource/wlan/qcacld-3.0/configs 2>/dev/null | grep -i peach
            echo "== cnss2 =="; ls vendor/qcom/opensource/wlan/platform 2>/dev/null
            echo "== mac80211/cfg80211 源 =="; ls kernel_platform/common/net/mac80211/kbuild 2>/dev/null | head
            echo "== BUILD.bazel 含 cfg80211 =="; grep -rl "cfg80211" --include=BUILD.bazel kernel_platform 2>/dev/null | head -10
          } 2>&1 | tee "$ROOT/logs/tree-probe.txt"

      - name: 🩹 应用 wonder 覆盖层 + 基础补丁
        run: |
          cd "$ROOT/tree"
          python3 - "$ROOT/opa" <<'PY' 2>&1 | tee "$ROOT/logs/overlay.log"
          import json, shutil, sys, os
          opa = sys.argv[1]
          m = json.load(open(os.path.join(opa, 'kernel/source-map.json')))
          missing = []
          for src, meta in m.items():
              dst = meta['kernel_path']
              s = os.path.join(opa, src)
              if not os.path.exists(dst):
                  missing.append(dst)
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              shutil.copy2(s, dst)
              print('COPY', src, '->', dst)
          if missing:
              print('!! 目标路径不存在的条目', len(missing))
              for x in missing[:20]:
                  print('   ', x)
          PY
          mkdir -p vendor/oplus/kernel/wifi
          cp -a "$ROOT/opa/kernel/wonder" vendor/oplus/kernel/wifi/wonder
          rm -rf kernel_platform/opairshare-route-b-provider
          cp -a "$ROOT/opa/kernel/provider" kernel_platform/opairshare-route-b-provider
          echo "== 打补丁 ==" | tee -a "$ROOT/logs/overlay.log"
          for p in "$ROOT/opa"/kernel/patches/000[1-7]-*.patch; do
            case "$p" in
              *0007-session-dp-candidate.patch) echo "SKIP(candidate) $p" | tee -a "$ROOT/logs/overlay.log"; continue;;
            esac
            if git apply --check -p1 "$p" 2>>"$ROOT/logs/overlay.log"; then
              git apply -p1 "$p" && echo "APPLIED $(basename "$p")" | tee -a "$ROOT/logs/overlay.log"
            else
              echo "FAILED-CHECK $(basename "$p")" | tee -a "$ROOT/logs/overlay.log"
            fi
          done
          git status --porcelain | head -50 | tee -a "$ROOT/logs/overlay.log"

      - name: ⚙️ 打开 WONDER / PASSTHRU 开关
        run: |
          cd "$ROOT/tree"
          CFG=vendor/qcom/opensource/wlan/qcacld-3.0/configs/sun_gki_peach-v2_defconfig
          cp "$CFG" "$ROOT/logs/defconfig.orig"
          python3 - "$CFG" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1]); keep = []
          for l in p.read_text().splitlines():
              if 'CONFIG_DRIVER_PASSTHRU_MODE' in l or 'CONFIG_WONDER_SUPPORT' in l:
                  continue
              keep.append(l)
          keep += ['CONFIG_DRIVER_PASSTHRU_MODE=y', 'CONFIG_WONDER_SUPPORT=y']
          p.write_text('\n'.join(keep) + '\n')
          print(p.read_text()[-400:])
          PY
          grep -nE "PASSTHRU|WONDER" "$CFG" | tee "$ROOT/logs/defconfig.tail"

      - name: 🏗️ 编 provider（最快，先验证覆盖层能不能编）
        continue-on-error: true
        run: |
          cd "$ROOT/tree/kernel_platform"
          mkdir -p "$ROOT/out"
          ./tools/bazel --output_user_root="$ROOT/bazel-cache" build \
            --jobs=${{ inputs.jobs }} --local_ram_resources=8192 \
            --//msm-kernel:skip_abi=true --//msm-kernel:skip_abl=true \
            --config=stamp --user_kmi_symbol_lists=//msm-kernel:android/abi_gki_aarch64_qcom \
            --incompatible_sandbox_hermetic_tmp=false --nozstd_dwarf_compression \
            //opairshare-route-b-provider:opairshare_wonder_provider \
            //opairshare-route-b-provider:opairshare_route_b_probe 2>&1 | tee "$ROOT/logs/build-provider.log"

      - name: 🏗️ 编 mac80211 + wonder（oplus 模块图）
        if: always()
        continue-on-error: true
        run: |
          cd "$ROOT/tree"
          bash kernel_platform/oplus/build/oplus_build_module.sh sun perf vendor/oplus/kernel/wifi \
            2>&1 | tee "$ROOT/logs/build-wonder.log"

      - name: 🏗️ 编 qca_cld3_peach_v2
        if: always() && inputs.build_wlan
        continue-on-error: true
        run: |
          cd "$ROOT/tree/kernel_platform"
          ./tools/bazel --output_user_root="$ROOT/bazel-cache" build \
            --jobs=${{ inputs.jobs }} --local_ram_resources=8192 \
            --//msm-kernel:skip_abi=true --//msm-kernel:skip_abl=true \
            --config=stamp --user_kmi_symbol_lists=//msm-kernel:android/abi_gki_aarch64_qcom \
            --incompatible_sandbox_hermetic_tmp=false --nozstd_dwarf_compression \
            //vendor/qcom/opensource/wlan/qcacld-3.0:sun_perf_qca_cld_peach-v2 \
            2>&1 | tee "$ROOT/logs/build-qcacld.log"

      - name: 🏗️ 编 cfg80211 / mac80211 / cnss2（common + platform 模块）
        if: always()
        continue-on-error: true
        run: |
          cd "$ROOT/tree/kernel_platform"
          ./tools/bazel --output_user_root="$ROOT/bazel-cache" build \
            --jobs=${{ inputs.jobs }} --local_ram_resources=8192 \
            --//msm-kernel:skip_abi=true --//msm-kernel:skip_abl=true \
            --config=stamp --user_kmi_symbol_lists=//msm-kernel:android/abi_gki_aarch64_qcom \
            --incompatible_sandbox_hermetic_tmp=false --nozstd_dwarf_compression \
            //vendor/qcom/opensource/wlan/platform/cnss2:cnss2 2>&1 | tee "$ROOT/logs/build-cnss2.log"

      - name: 📦 收集产物
        if: always()
        run: |
          cd "$ROOT/tree"
          mkdir -p "$ROOT/out/ko" "$ROOT/out/symvers"
          { find . -name '*.ko' -newermt '-3 hours' -not -path './.repo/*' 2>/dev/null | head -200
            find bazel-* -name '*.ko' 2>/dev/null | head -200; } | sort -u > "$ROOT/out/ko-list.txt"
          while read -r f; do
            [ -f "$f" ] || continue
            n=$(basename "$f")
            cp -f "$f" "$ROOT/out/ko/$n" 2>/dev/null || true
          done < "$ROOT/out/ko-list.txt"
          find . -name 'Module.symvers' -not -path './.repo/*' 2>/dev/null | head -40 | while read -r f; do
            d=$(dirname "$f" | tr '/' '_')
            cp -f "$f" "$ROOT/out/symvers/$d.symvers" 2>/dev/null || true
          done
          ls -la "$ROOT/out/ko" | tee "$ROOT/logs/artifacts.txt"
          du -sh "$ROOT/out"/* 2>/dev/null | tee -a "$ROOT/logs/artifacts.txt"

      - name: 📤 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opa-wlan-${{ github.run_id }}
          path: |
            /home/runner/opa-build/out
            /home/runner/opa-build/logs
          if-no-files-found: warn
          compression-level: 0
